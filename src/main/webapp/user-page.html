<!DOCTYPE html>
<html>
  <head>
    <title>User Page</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/user-page.css">
    <script src="/js/user-page-loader.js"></script>
    <script src="https://cdn.ckeditor.com/ckeditor5/11.2.0/classic/ckeditor.js"></script>
  </head>
  <body onload="buildUI()">
    <nav>
      <ul id="navigation">
        <li><a href="/">Home</a></li>
      </ul>
    </nav>
    <center>
      <div id="user-name"><h1 id="page-title">User Page</h1></div>
    </center>

    <center>
      <br/>
      <b>About Me</b>
      <br/>
      <div id="about-me-container">Loading...</div>
      <br/>
    </center>
    <form id="about-me-form" action="/about" method="POST" class="hidden">
      <br/>
      <div id="update-text">Update AboutMe:</div>
      <br/>
      <textarea name="about-me" placeholder="About me" id="about-me-input"></textarea>
      <br/>
      <input type="submit" value="Submit">
    </form>
    <hr/>

    <div id="message-container">Loading...</div>
    <form id="message-form" action="/messages" method="POST" class="hidden">
      <div id="update-text">Enter a new message:</div>
      <br/>
      <textarea name="text" placeholder="Enter a message" id="message-input"></textarea>
      <br/>
      <input type="submit" value="Submit">
    </form>
    <hr/>



  </body>
</html>
